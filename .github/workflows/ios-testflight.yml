name: iOS TestFlight

# The only workflow in this repository, and the one exception to "no Unity in CI" (CLAUDE.md): Unity never runs
# here. This PC exports the Xcode project (tools/build-ios.ps1 -Upload puts Builds/ios-xcode.zip on the rolling
# "ios-source" pre-release and dispatches this workflow); the macOS runner only does what needs a Mac: Xcode
# archive, signing and the upload to App Store Connect (TestFlight). Manual only: nothing ships on push.
#
# Credentials: the Apple signing material of the Amityville pipeline, in AWS Secrets Manager
# (amityville/prod/apple-signing: dist_cert_p12, dist_cert_password, team_id, asc_key_id, asc_issuer_id,
# asc_api_key_p8), read through the same OIDC role (vars.AWS_ROLE_ARN); the role's trust policy must list this
# repository. Signing is automatic and driven by the App Store Connect key, so no provisioning profile is pinned:
# Xcode registers the App ID and mints the profile itself.
#
# The build must exist as an app record in App Store Connect (same bundle identifier) before the upload succeeds.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion, the version code (0.4.2 -> 402); App Store Connect refuses a repeat"
        required: true
      version:
        description: "CFBundleShortVersionString (0.4.2)"
        required: true
      source_tag:
        description: "Release tag carrying ios-xcode.zip"
        required: true
        default: ios-source

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  BUNDLE_ID: com.cosnuau.vacuumcleanersimulator2026
  APP_NAME: "Vacuum Cleaner Simulator 2026"

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    if: vars.AWS_ROLE_ARN != ''

    steps:
      - name: Download the exported Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.source_tag }}" -R "${{ github.repository }}" -p ios-xcode.zip -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/xcode"
          unzip -q "$RUNNER_TEMP/ios-xcode.zip" -d "$RUNNER_TEMP/xcode"
          ls "$RUNNER_TEMP/xcode"
          test -d "$RUNNER_TEMP/xcode/Unity-iPhone.xcodeproj"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch the signing material from Secrets Manager
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id amityville/prod/apple-signing \
            --query SecretString --output text > secret.json

          missing=""
          for field in dist_cert_p12 dist_cert_password team_id asc_key_id asc_issuer_id asc_api_key_p8; do
            [ "$(jq -r --arg f "$field" '.[$f] // ""' secret.json)" = "" ] && missing="$missing $field"
          done
          if [ -n "$missing" ]; then
            echo "::error::The signing secret is incomplete (missing:$missing)."
            exit 1
          fi
          for field in dist_cert_password team_id asc_key_id asc_issuer_id; do
            echo "::add-mask::$(jq -r --arg f "$field" '.[$f]' secret.json)"
          done

          jq -r .dist_cert_p12 secret.json | base64 --decode > "$RUNNER_TEMP/cert.p12"
          {
            echo "CERT_PASSWORD=$(jq -r .dist_cert_password secret.json)"
            echo "TEAM_ID=$(jq -r .team_id secret.json)"
            echo "ASC_KEY_ID=$(jq -r .asc_key_id secret.json)"
            echo "ASC_ISSUER_ID=$(jq -r .asc_issuer_id secret.json)"
          } >> "$GITHUB_ENV"
          mkdir -p ~/private_keys
          jq -r .asc_api_key_p8 secret.json | base64 --decode > ~/private_keys/AuthKey_$(jq -r .asc_key_id secret.json).p8
          rm secret.json

      - name: Import the distribution certificate
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Stamp the version and the export-compliance answer
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/xcode/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" "$PLIST"
          # The game talks to nobody; declaring it answers the export-compliance question before it is asked.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "--- purpose strings (expect none):"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -i UsageDescription || echo "none"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/xcode"
          xcodebuild -version
          # Automatic signing driven by the App Store Connect key: Xcode registers the App ID and mints the
          # App Store profile itself. Applied to the app target only through the scheme; UnityFramework signs
          # with the team like any embedded framework.
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error|warning: .*sign|Signing Identity|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/app.xcarchive"

      - name: Export the IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ env.APP_NAME }} ${{ inputs.version }} (${{ inputs.build_number }}) uploaded to App Store Connect"
            echo ""
            echo "TestFlight processes it in a few minutes; internal testers get it without review."
          } >> "$GITHUB_STEP_SUMMARY"
